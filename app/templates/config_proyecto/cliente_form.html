{% extends "base.html" %}
{% block title %}{{ 'Editar' if cliente else 'Nuevo' }} cliente — Hytech DocReview{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('config.index') }}">Configuración</a></li>
    <li class="breadcrumb-item active">{{ 'Editar' if cliente else 'Nuevo' }} cliente</li>
  </ol>
</nav>

<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header">
        <h5 class="mb-0">{{ 'Editar' if cliente else 'Nuevo' }} cliente</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre del cliente</label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ cliente.nombre if cliente else '' }}"
                   placeholder="Ej: Pluspetrol" required autofocus>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="{{ url_for('config.index') }}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
